<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phosphor</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="Phosphor - A minimalist Nostr web client built with a cyberpunk terminal aesthetic. Decentralized microblogging and long-form reading.">
    <meta name="keywords" content="Nostr, client, terminal, cyberpunk, decentralized, web3, social media, microblogging">
    <meta property="og:title" content="Phosphor Nostr Client">
    <meta property="og:description" content="A lightweight, terminal-themed client for the Nostr network.">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="/assets/terminal.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="manifest" href="/assets/site.webmanifest">
    
    <style>
        .container { max-width: 700px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        .hidden { display: none !important; }
        
        .post-card { display: flex; border: 1px solid currentColor; padding: 15px; margin-bottom: 15px; background: transparent; }
        
        .avatar-box { width: 48px; height: 48px; border: 1px dashed currentColor; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; font-size: 1.1em; overflow: hidden; background: var(--bg-base); }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(0.5); }
        
        .post-main { margin-left: 15px; flex-grow: 1; min-width: 0; }
        .post-header { margin-bottom: 8px; display: flex; flex-direction: column; }
        .author-line { font-size: 1.1em; font-weight: bold; }
        .meta-line { font-size: 0.8em; opacity: 0.7; margin-top: 2px; }
        .post-header a { text-decoration: none; color: inherit; }
        .post-header a:hover { color: var(--t-green, #00ff41); }
        
        .post-content { margin-bottom: 12px; word-wrap: break-word; line-height: 1.4; }
        
        .nostr-embed-link { display: inline-block; background: rgba(0,255,65,0.1); border: 1px dashed currentColor; padding: 2px 6px; margin: 2px 0; font-size: 0.85em; text-decoration: none !important; color: inherit; word-break: break-all; }
        .nostr-embed-link:hover { background: var(--t-green, #00ff41); color: var(--bg-base, #030303); }

        .article-card { border: 2px solid currentColor; }
        .article-title { font-size: 1.25em; font-weight: bold; margin-bottom: 8px; line-height: 1.3; }
        .article-summary { opacity: 0.85; margin-bottom: 12px; font-size: 0.95em; line-height: 1.4; }

        .pulse-card { border: 2px dashed currentColor; background: rgba(0,255,65,0.01); }
        .pulse-badge { font-size: 0.75em; opacity: 0.8; margin-bottom: 4px; display: inline-block; border: 1px solid currentColor; padding: 2px 6px; }

        .post-media { margin-top: 10px; margin-bottom: 12px; max-width: 250px; height: 160px; border: 1px dashed currentColor; padding: 3px; overflow: hidden; cursor: pointer; background: rgba(0,255,65,0.02); }
        .post-media img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(0.3); display: block; transition: transform 0.2s; }
        .post-media:hover img { transform: scale(1.03); }

        .post-video { width: 100%; max-width: 350px; margin-top: 10px; margin-bottom: 12px; border: 1px dashed currentColor; display: block; background: rgba(0,255,65,0.02); }
        .json-payload { font-size: 0.8em; overflow-x: auto; background: rgba(0,255,65,0.05); padding: 10px; border: 1px dashed currentColor; margin-bottom: 12px; }
        
        #lightboxModal, #quoteModal, #relayModal, #rawModal, #editModal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        #lightboxModal { cursor: zoom-out; }
        #lightboxModal img { max-width: 90%; max-height: 90%; border: 2px solid var(--t-green, #00ff41); }
        
        .modal-content-box { background: var(--bg-base, #030303); border: 2px solid currentColor; padding: 20px; width: 90%; max-width: 550px; box-sizing: border-box; }

        .post-actions { display: flex; justify-content: flex-start; gap: 12px; max-width: 500px; margin-top: 10px; flex-wrap: wrap; }
        .action-btn { background: transparent !important; border: none; color: inherit; cursor: pointer; font-family: inherit; padding: 5px 8px; text-decoration: none !important; display: inline-block; }
        .action-btn:hover { background: var(--t-green, #00ff41) !important; color: var(--bg-base, #030303) !important; }
        
        .client-tag { text-align: right; font-style: italic; opacity: 0.4; font-size: 0.8em; margin-top: 5px; }

        .composer-card { border: 2px dashed currentColor; padding: 15px; margin-bottom: 25px; display: flex; }
        textarea.sys-input { width: 100%; box-sizing: border-box; background: transparent; color: inherit; border: none; border-bottom: 1px dashed currentColor; padding: 10px 0; font-family: inherit; margin-bottom: 10px; resize: vertical; outline: none; }
        
        .broadcast-btn, .modal-btn { width: auto; padding: 5px 10px; margin: 0; cursor: pointer; background: transparent !important; color: inherit; border: 1px dashed currentColor; font-family: inherit; }
        .broadcast-btn:hover, .modal-btn:hover { background: var(--t-green, #00ff41) !important; color: var(--bg-base, #030303) !important; }
        
        nav { display: flex; gap: 15px; border-bottom: 1px solid currentColor; padding-bottom: 15px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;}
        nav a { text-decoration: none !important; color: inherit; }
        nav a:hover { color: var(--t-green, #00ff41); text-decoration: none !important; }
        
        .auth-status { font-size: 0.8em; opacity: 0.9; margin-left: auto; background: transparent; border: 1px dashed currentColor; padding: 4px 8px; cursor: pointer; font-family: inherit; color: inherit; text-decoration: none !important; }
        .auth-status:hover { background: var(--t-green, #00ff41); color: var(--bg-base, #030303); }

        .relay-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed currentColor; font-size: 0.9em; }
    </style>
</head>
<body class="terminal t-crt">
    <div class="container">
        <header>
            <h1>> Phosphor</h1>
            <nav>
                <a href="index.html">[ TIMELINE ]</a>
                <a href="profile.html">[ PROFILE ]</a>
                <a href="#" id="loginBtn">[ LOGIN ]</a>
                <a href="#" id="logoutBtn" class="hidden">[ LOGOUT ]</a>
                <button id="relayStatusBtn" class="auth-status" onclick="openRelayModal()">[ RELAYS: CONNECTING... ]</button>
            </nav>
        </header>

        <!-- Composer Card hidden by default until logged in -->
        <div class="composer-card hidden" id="composerCard">
            <div class="avatar-box" id="userAvatarBox">[P]</div>
            <div class="post-main">
                <textarea id="postContentInput" class="sys-input" rows="3" placeholder="What's happening on the network?"></textarea>
                <div style="text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 5px;">
                    <a href="compose.html" class="action-btn modal-btn" style="border: 1px solid currentColor; text-decoration: none;" title="Compose Long-form Article">[ COMPOSE ]</a>
                    <span style="opacity: 0.5;">|</span>
                    <button id="broadcastBtn" class="action-btn broadcast-btn" style="border: 1px solid currentColor;">> BROADCAST_EVENT</button>
                </div>
            </div>
        </div>

        <section id="feed">
            <div id="posts-container"></div>
            <p id="noMoreText" style="text-align: center; opacity: 0.5;">[ Listening to Network Multi-Relays... ]</p>
        </section>
    </div>

    <!-- Modals -->
    <div id="lightboxModal" onclick="this.style.display='none'">
        <img id="lightboxImg" src="" alt="Zoomed Image">
    </div>

    <div id="quoteModal">
        <div class="modal-content-box">
            <div style="font-weight: bold; margin-bottom: 10px;">> QUOTE_REPLY</div>
            <div id="quoteTargetPreview" style="font-size: 0.9em; opacity: 0.7; border-left: 2px dashed currentColor; padding-left: 10px; margin-bottom: 12px; max-height: 80px; overflow: hidden;"></div>
            <textarea id="quoteContentInput" class="sys-input" rows="3" placeholder="Write quote response..."></textarea>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <button class="action-btn modal-btn" onclick="closeQuoteModal()">[CANCEL]</button>
                <button id="sendQuoteBtn" class="action-btn modal-btn" style="border: 1px solid currentColor;">> BROADCAST_QUOTE</button>
            </div>
        </div>
    </div>

    <div id="editModal">
        <div class="modal-content-box">
            <div style="font-weight: bold; margin-bottom: 10px;">> EDIT_TRANSMISSION</div>
            <textarea id="editContentInput" class="sys-input" rows="4" placeholder="Update your note..."></textarea>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <button class="action-btn modal-btn" onclick="closeEditModal()">[CANCEL]</button>
                <button id="sendEditBtn" class="action-btn modal-btn" style="border: 1px solid currentColor;">> UPDATE_EVENT</button>
            </div>
        </div>
    </div>

    <div id="relayModal">
        <div class="modal-content-box">
            <div style="font-weight: bold; margin-bottom: 12px;">> SYSTEM_RELAY_STATUS</div>
            <div id="relayListContainer" style="margin-bottom: 15px;">
                <p style="opacity: 0.5;">Checking network connections...</p>
            </div>
            <div style="text-align: right;">
                <button class="action-btn modal-btn" onclick="closeRelayModal()">[CLOSE]</button>
            </div>
        </div>
    </div>

    <div id="rawModal">
        <div class="modal-content-box" style="width: 95%; max-width: 600px;">
            <div style="font-weight: bold; margin-bottom: 12px;">> RAW_EVENT_DATA</div>
            <pre id="rawEventContent" class="json-payload" style="max-height: 60vh; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;"></pre>
            <div style="text-align: right; margin-top: 10px;">
                <button class="action-btn modal-btn" onclick="closeRawModal()">[CLOSE]</button>
            </div>
        </div>
    </div>

    <script>
        let RELAYS = [];
        let BLOSSOM_SERVERS = [];

        let currentUserPubkey = localStorage.getItem('phosphor_pubkey') || null;
        let profileCache = {};
        let eventsCache = {};
        let quoteTargetEvent = null;
        let editTargetEvent = null;
        let relayStatusMap = {};
        
        let metricsCache = {};
        let pendingMetricsIds = new Set();
        let metricsTimeout = null;
        
        let likedEvents = new Set();
        let repostedEvents = new Set();

        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const relayStatusBtn = document.getElementById('relayStatusBtn');
        const broadcastBtn = document.getElementById('broadcastBtn');
        const postContentInput = document.getElementById('postContentInput');
        const postsContainer = document.getElementById('posts-container');
        const userAvatarBox = document.getElementById('userAvatarBox');
        const composerCard = document.getElementById('composerCard');

        const quoteModal = document.getElementById('quoteModal');
        const quoteTargetPreview = document.getElementById('quoteTargetPreview');
        const quoteContentInput = document.getElementById('quoteContentInput');
        const sendQuoteBtn = document.getElementById('sendQuoteBtn');
        
        const editModal = document.getElementById('editModal');
        const editContentInput = document.getElementById('editContentInput');
        const sendEditBtn = document.getElementById('sendEditBtn');

        const relayModal = document.getElementById('relayModal');
        const relayListContainer = document.getElementById('relayListContainer');
        const rawModal = document.getElementById('rawModal');
        const rawEventContent = document.getElementById('rawEventContent');

        let activeSockets = [];

        async function loadConfig() {
            try {
                let res = await fetch('config.json');
                let config = await res.json();
                RELAYS = config.relays || [];
                BLOSSOM_SERVERS = config.blossom_servers || [];
                updateAuthState();
                fetchMyAvatar();
                connectMultiRelays();
            } catch (e) {
                console.error("Failed to load config.json", e);
                alert("> ERROR: Missing config.json");
            }
        }

        function updateAuthState() {
            if (currentUserPubkey) {
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                composerCard.classList.remove('hidden');
                // Unhide all specific edit buttons belonging to current user
                document.querySelectorAll('.edit-btn-' + currentUserPubkey).forEach(el => el.classList.remove('hidden'));
            } else {
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                composerCard.classList.add('hidden');
                userAvatarBox.innerHTML = "[P]";
                // Hide all edit buttons
                document.querySelectorAll('.edit-btn').forEach(el => el.classList.add('hidden'));
            }
        }

        loginBtn.addEventListener('click', async function(e) {
            e.preventDefault();
            if (window.nostr && typeof window.nostr.getPublicKey === 'function') {
                try {
                    currentUserPubkey = await window.nostr.getPublicKey();
                    localStorage.setItem('phosphor_pubkey', currentUserPubkey);
                    updateAuthState();
                    fetchMyAvatar();
                    alert('> CONNECTION SUCCESSFUL.');
                } catch (err) { alert('> ERROR: Login failed.'); }
            } else { alert('> WARNING: NIP-07 extension not found.'); }
        });

        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('phosphor_pubkey');
            currentUserPubkey = null;
            updateAuthState();
            alert('> SESSION ENDED.');
            location.reload();
        });

        async function copyNaddr(kind, pubkey, identifier) {
            try {
                // Trik Dynamic Import ESM (Versi 2.24.1)
                const nostrTools = await import('https://cdn.jsdelivr.net/npm/nostr-tools@2.24.1/+esm');
                
                let naddr = nostrTools.nip19.naddrEncode({ 
                    kind: parseInt(kind), 
                    pubkey: pubkey, 
                    identifier: identifier 
                });
                
                navigator.clipboard.writeText(`nostr:${naddr}`);
                alert(`> SUCCESS: Copied to clipboard!\n\nnostr:${naddr}`);
            } catch (e) { 
                console.error(e);
                alert('> ERROR: Failed to encode NIP-19 naddr.'); 
            }
        }

        function fetchMyAvatar() {
            if (!currentUserPubkey) return;
            RELAYS.forEach(url => {
                let sock = new WebSocket(url);
                sock.onopen = () => sock.send(JSON.stringify(["REQ", "my-av", {kinds:[0], authors:[currentUserPubkey], limit:1}]));
                sock.onmessage = (e) => {
                    let d = JSON.parse(e.data);
                    if (d[0] === "EVENT" && d[2] && d[2].kind === 0) {
                        try {
                            let meta = JSON.parse(d[2].content);
                            let rawName = meta.name ? `@${meta.name.toLowerCase().replace(/\s+/g, '')}` : `@${currentUserPubkey.substring(0,8)}`;
                            let domainPart = (meta.nip05 && meta.nip05.includes('@')) ? meta.nip05.split('@')[1] : '';
                            
                            profileCache[currentUserPubkey] = {
                                name: meta.display_name || meta.name || currentUserPubkey.substring(0, 6),
                                handle: domainPart ? `${rawName} ✓ ${domainPart}` : rawName,
                                nip05: meta.nip05 || "",
                                picture: meta.picture || null
                            };
                            
                            if (meta.picture) userAvatarBox.innerHTML = `<img src="${escapeHtml(meta.picture)}" alt="Me">`;
                            updatePostUI(currentUserPubkey);
                        } catch(err){}
                    }
                };
            });
        }

        function timeAgo(unixTimestamp) {
            let seconds = Math.floor((Date.now() / 1000) - unixTimestamp);
            let intervals = { year: 31536000, month: 2592000, day: 86400, hour: 3600, minute: 60 };
            if (seconds < 60) return "Just now";
            for (let i in intervals) {
                let count = Math.floor(seconds / intervals[i]);
                if (count >= 1) return `${count} ${i}${count > 1 ? 's' : ''} ago`;
            }
            return "Just now";
        }

        function openLightbox(imgSrc) { document.getElementById('lightboxImg').src = imgSrc; document.getElementById('lightboxModal').style.display = 'flex'; }
        
        function openRawModal(eventId) {
            let ev = eventsCache[eventId];
            if (ev) {
                rawEventContent.textContent = JSON.stringify(ev, null, 2);
                rawModal.style.display = 'flex';
            }
        }
        function closeRawModal() { rawModal.style.display = 'none'; }

        function openQuoteModal(eventId) {
            if (!currentUserPubkey || !window.nostr) {
                alert('> ERROR: Not logged in! Login to quote.');
                return;
            }
            let ev = eventsCache[eventId];
            if (!ev) return;
            quoteTargetEvent = ev;
            quoteTargetPreview.textContent = ev.content.length > 150 ? ev.content.substring(0, 150) + "..." : ev.content;
            quoteContentInput.value = "";
            quoteModal.style.display = 'flex';
        }
        function closeQuoteModal() { quoteModal.style.display = 'none'; quoteTargetEvent = null; }

        function openEditModal(eventId) {
            if (!currentUserPubkey || !window.nostr) return;
            let ev = eventsCache[eventId];
            if (!ev) return;
            editTargetEvent = ev;
            editContentInput.value = ev.content;
            editModal.style.display = 'flex';
        }
        function closeEditModal() { editModal.style.display = 'none'; editTargetEvent = null; }

        function openRelayModal() {
            let htmlContent = "";
            RELAYS.forEach(url => {
                let isOnline = relayStatusMap[url] === true;
                let statusBadge = isOnline ? '<span style="color: var(--t-green, #00ff41);">[ONLINE]</span>' : '<span style="color: #ff4141;">[OFFLINE]</span>';
                htmlContent += `<div class="relay-item"><span>${escapeHtml(url)}</span> ${statusBadge}</div>`;
            });
            relayListContainer.innerHTML = htmlContent;
            relayModal.style.display = 'flex';
        }
        function closeRelayModal() { relayModal.style.display = 'none'; }

        function initMetrics(id) { if (!metricsCache[id]) metricsCache[id] = { replies: 0, reposts: 0, likes: 0, processed: new Set() }; }

        function updateMetricsUI(id) {
            let m = metricsCache[id];
            let er = document.getElementById(`metric-replies-${id}`);
            let et = document.getElementById(`metric-reposts-${id}`);
            let el = document.getElementById(`metric-likes-${id}`);
            if(er) er.textContent = m.replies;
            if(et) et.textContent = m.reposts;
            if(el) el.textContent = m.likes;
        }

        function requestMetrics(eventId) {
            pendingMetricsIds.add(eventId);
            clearTimeout(metricsTimeout);
            metricsTimeout = setTimeout(() => {
                let ids = Array.from(pendingMetricsIds);
                if(ids.length === 0) return;
                let req = JSON.stringify(["REQ", "metrics-" + Math.random().toString(36).substring(7), { "#e": ids, "kinds": [1, 6, 7, 16] }]);
                activeSockets.forEach(sock => { if (sock && sock.readyState === WebSocket.OPEN) sock.send(req); });
                pendingMetricsIds.clear();
            }, 1500);
        }

        async function likeEvent(eventId) {
            let ev = eventsCache[eventId];
            if (!ev) return;
            if (!currentUserPubkey || !window.nostr) { alert('> ERROR: Not logged in!'); return; }
            if (likedEvents.has(eventId)) { alert('> ERROR: You have already liked this event.'); return; }

            let rawEvent = { kind: 7, created_at: Math.floor(Date.now() / 1000), tags: [["e", ev.id, ""], ["p", ev.pubkey, ""]], content: "+", pubkey: currentUserPubkey };
            try {
                let signedEvent = await window.nostr.signEvent(rawEvent);
                activeSockets.forEach(sock => { if (sock && sock.readyState === WebSocket.OPEN) sock.send(JSON.stringify(["EVENT", signedEvent])); });
                likedEvents.add(eventId); initMetrics(eventId); metricsCache[eventId].processed.add(signedEvent.id); metricsCache[eventId].likes++; updateMetricsUI(eventId);
            } catch (err) { alert('> ERROR: Failed to broadcast like.'); }
        }

        async function repostEvent(eventId) {
            let ev = eventsCache[eventId];
            if (!ev) return;
            if (!currentUserPubkey || !window.nostr) { alert('> ERROR: Not logged in!'); return; }
            if (repostedEvents.has(eventId)) { alert('> ERROR: You have already reposted this event.'); return; }
            if (!confirm('> Repost this content to your timeline?')) return;

            let rawEvent = { kind: 6, created_at: Math.floor(Date.now() / 1000), tags: [["e", ev.id, "", "mention"], ["p", ev.pubkey, ""]], content: JSON.stringify(ev), pubkey: currentUserPubkey };
            let dTag = ev.tags.find(t => t[0] === 'd');
            if (ev.kind === 30023 && dTag) { rawEvent.tags.push(["a", `${ev.kind}:${ev.pubkey}:${dTag[1]}`, ""]); rawEvent.kind = 16; }

            try {
                let signedEvent = await window.nostr.signEvent(rawEvent);
                let sentCount = 0;
                activeSockets.forEach(sock => { if (sock && sock.readyState === WebSocket.OPEN) { sock.send(JSON.stringify(["EVENT", signedEvent])); sentCount++; } });
                repostedEvents.add(eventId); initMetrics(eventId); metricsCache[eventId].processed.add(signedEvent.id); metricsCache[eventId].reposts++; updateMetricsUI(eventId);
                alert(`> SUCCESS: Reposted to ${sentCount} relays!`);
            } catch (err) { alert('> ERROR: Failed to broadcast repost.'); }
        }

        function connectMultiRelays() {
            let onlineCount = 0;
            RELAYS.forEach(url => {
                relayStatusMap[url] = false;
                let socket = new WebSocket(url);

                socket.onopen = function() {
                    onlineCount++;
                    relayStatusMap[url] = true;
                    relayStatusBtn.textContent = `[ RELAYS: ${onlineCount}/${RELAYS.length} ONLINE ]`;
                    socket.send(JSON.stringify(["REQ", "feed-" + Math.random(), { "kinds": [1, 30023, 20000], "limit": 40 }]));
                };

                socket.onerror = function() { relayStatusMap[url] = false; };
                socket.onclose = function() { relayStatusMap[url] = false; };

                socket.onmessage = function(event) {
                    try {
                        let data = JSON.parse(event.data);
                        if (data[0] === "EVENT" && data[2]) {
                            let ev = data[2];

                            // Prevent rendering NIP-09 Deleted Events
                            if (ev.kind === 5) {
                                ev.tags.forEach(t => {
                                    if (t[0] === 'e') {
                                        let oldCard = document.getElementById(`post-${t[1]}`);
                                        if (oldCard) oldCard.remove();
                                    }
                                });
                                return;
                            }

                            if (ev.kind === 0) {
                                try {
                                    let meta = JSON.parse(ev.content);
                                    let rawName = meta.name ? `@${meta.name.toLowerCase().replace(/\s+/g, '')}` : `@${ev.pubkey.substring(0,8)}`;
                                    let domainPart = (meta.nip05 && meta.nip05.includes('@')) ? meta.nip05.split('@')[1] : '';
                                    
                                    profileCache[ev.pubkey] = {
                                        name: meta.display_name || meta.name || ev.pubkey.substring(0, 6),
                                        handle: domainPart ? `${rawName} ✓ ${domainPart}` : rawName,
                                        nip05: meta.nip05 || "",
                                        picture: meta.picture || null
                                    };
                                    updatePostUI(ev.pubkey);
                                } catch(e){}
                            }
                            
                            if (ev.kind === 1 || ev.kind === 6 || ev.kind === 7 || ev.kind === 16) {
                                let eTags = ev.tags.filter(t => t[0] === 'e').map(t => t[1]);
                                eTags.forEach(targetId => {
                                    initMetrics(targetId);
                                    if (!metricsCache[targetId].processed.has(ev.id)) {
                                        metricsCache[targetId].processed.add(ev.id);
                                        if (ev.kind === 1) metricsCache[targetId].replies++;
                                        if (ev.kind === 6 || ev.kind === 16) metricsCache[targetId].reposts++;
                                        if (ev.kind === 7) metricsCache[targetId].likes++;
                                        updateMetricsUI(targetId);
                                    }
                                });
                            }

                            if (ev.kind === 1 || ev.kind === 30023 || (ev.kind >= 20000 && ev.kind < 30000)) {
                                if (!profileCache[ev.pubkey]) {
                                    profileCache[ev.pubkey] = { pending: true };
                                    let req = JSON.stringify(["REQ", "prof-" + ev.pubkey.substring(0, 8), { "kinds": [0], "authors": [ev.pubkey], "limit": 1 }]);
                                    activeSockets.forEach(sock => { if (sock && sock.readyState === WebSocket.OPEN) sock.send(req); });
                                }
                                eventsCache[ev.id] = ev; 
                                renderPost(ev);
                            }
                        }
                    } catch (err) {}
                };
                activeSockets.push(socket);
            });
        }

        function updatePostUI(pubkey) {
            let info = profileCache[pubkey];
            if (!info || info.pending) return;
            document.querySelectorAll(`.author-${pubkey}`).forEach(el => { el.textContent = info.name; });
            document.querySelectorAll(`.handle-${pubkey}`).forEach(el => { el.textContent = `${info.handle}`; });
            document.querySelectorAll(`.avatar-${pubkey}`).forEach(el => {
                if (info.picture) el.innerHTML = `<img src="${escapeHtml(info.picture)}" alt="Avatar">`;
            });
        }

        function renderPost(ev) {
            if (document.getElementById(`post-${ev.id}`)) return;
            initMetrics(ev.id);
            requestMetrics(ev.id);

            let shortPub = ev.pubkey.substring(0, 4).toUpperCase();
            let info = profileCache[ev.pubkey];
            
            if (!info || info.pending) {
                info = { name: `Node_${shortPub}`, handle: `@${ev.pubkey.substring(0, 8)}`, nip05: "", picture: null };
            }

            let avatarHtml = info.picture ? `<img src="${escapeHtml(info.picture)}" alt="Avatar">` : `[${shortPub}]`;
            let timeStr = timeAgo(ev.created_at);
            
            let clientName = "unknown";
            let dTagValue = "";
            let hasExpiration = false;
            let expTimeStr = "EPHEMERAL_STORY";

            ev.tags.forEach(t => { 
                if (t[0] === "client") clientName = t[1]; 
                if (t[0] === "d") dTagValue = t[1];
                if (t[0] === "expiration") {
                    hasExpiration = true; let expUnix = parseInt(t[1]); let diff = expUnix - Math.floor(Date.now() / 1000);
                    expTimeStr = diff > 0 ? `Exp in ${Math.floor(diff / 3600)}h ${Math.floor((diff % 3600) / 60)}m` : "Expired";
                }
            });

            let isJsonPayload = false; let parsedJsonContent = "";
            if (ev.kind === 1 && ev.content.trim().startsWith('{') && ev.content.trim().endsWith('}')) {
                try { parsedJsonContent = JSON.stringify(JSON.parse(ev.content.trim()), null, 2); isJsonPayload = true; } catch (e) {}
            }
            
            let isPulse = (ev.kind >= 20000 && ev.kind < 30000) || (ev.kind === 1 && hasExpiration);
            let isMine = (currentUserPubkey && ev.pubkey === currentUserPubkey);
            let editBtnVisibility = isMine ? '' : 'hidden';

            let card = document.createElement('div');
            card.id = `post-${ev.id}`;
            
            if (ev.kind === 30023) {
                card.className = 'post-card article-card';
                let title = "Untitled Article"; let summary = ""; let coverImg = "";
                ev.tags.forEach(t => { if (t[0] === "title") title = t[1]; if (t[0] === "summary") summary = t[1]; if (t[0] === "image") coverImg = t[1]; });

                let coverHtml = coverImg ? `<div class="post-media" onclick="openLightbox('${coverImg}')"><img src="${coverImg}" alt="Cover Article"></div>` : "";
                let articleTargetParam = dTagValue ? `d=${encodeURIComponent(dTagValue)}&author=${ev.pubkey}` : `id=${ev.id}`;

                card.innerHTML = `
                    <a href="profile.html?pubkey=${ev.pubkey}" class="avatar-box avatar-${ev.pubkey}" style="text-decoration:none; color:inherit;">${avatarHtml}</a>
                    <div class="post-main">
                        <div class="post-header">
                            <span class="author-line"><a href="profile.html?pubkey=${ev.pubkey}"><strong class="author-${ev.pubkey}">${escapeHtml(info.name)}</strong></a></span>
                            <span class="dim-text meta-line"><span class="handle-${ev.pubkey}">${escapeHtml(info.handle)}</span> · ${timeStr}</span>
                        </div>
                        <div class="article-title">${escapeHtml(title)}</div>
                        ${coverHtml}
                        <div class="article-summary">${escapeHtml(summary || ev.content.substring(0, 180) + '...')}</div>
                        <div class="post-actions">
                            <a href="notes.html?${articleTargetParam}" class="action-btn" title="Read Article" style="text-decoration:none;">[read]</a>
                            <button class="action-btn" title="Copy naddr link" onclick="copyNaddr('30023', '${ev.pubkey}', '${escapeHtml(dTagValue)}')">[c] naddr</button>
                            <button class="action-btn" title="Repost" onclick="repostEvent('${ev.id}')">[t] <span id="metric-reposts-${ev.id}">0</span></button>
                            <button class="action-btn" title="Like" onclick="likeEvent('${ev.id}')">[+] <span id="metric-likes-${ev.id}">0</span></button>
                            <button class="action-btn" title="Quote" onclick="openQuoteModal('${ev.id}')">[q]</button>
                            <button class="action-btn" title="View Raw Data" onclick="openRawModal('${ev.id}')">[raw]</button>
                            <a href="compose.html?d=${escapeHtml(dTagValue)}&author=${ev.pubkey}" class="action-btn edit-btn edit-btn-${ev.pubkey} ${editBtnVisibility}" style="text-decoration: none;" title="Edit Article">[edit]</a>
                        </div>
                        <div class="client-tag">> long_form / via ${escapeHtml(clientName)}</div>
                    </div>
                `;
            }
            else if (isPulse) {
                card.className = 'post-card pulse-card';
                let contentText = ev.content; let mediaHtml = "";
                contentText = contentText.replace(/(https?:\/\/[^\s]+?\.(png|jpg|jpeg|gif|webp|mp4|webm|ogg)(\?[^\s]*)?)/gi, function(url, match1, ext) {
                    let lowerExt = ext.toLowerCase();
                    if (['mp4', 'webm', 'ogg'].includes(lowerExt)) mediaHtml += `<video controls class="post-video"><source src="${url}" type="video/${lowerExt}">Video format not supported.</video>`;
                    else mediaHtml += `<div class="post-media" onclick="openLightbox('${url}')"><img src="${url}" alt="Pulse Media"></div>`;
                    return "";
                });
                contentText = escapeHtml(contentText.trim()).replace(/(?:nostr:)?(n(?:pub|sec|ote|profile|event|addr|relay)1[a-z0-9]+)/gi, function(match, nip19Id) {
                    let shortId = nip19Id.substring(0, 10) + '...' + nip19Id.substring(nip19Id.length - 4);
                    return `<a href="nostr:${nip19Id}" class="nostr-embed-link" target="_blank" onclick="event.stopPropagation()">[NOSTR: ${shortId}]</a>`;
                });

                card.innerHTML = `
                    <a href="profile.html?pubkey=${ev.pubkey}" class="avatar-box avatar-${ev.pubkey}" style="text-decoration:none; color:inherit;">${avatarHtml}</a>
                    <div class="post-main">
                        <div class="post-header">
                            <span class="author-line"><a href="profile.html?pubkey=${ev.pubkey}"><strong class="author-${ev.pubkey}">${escapeHtml(info.name)}</strong></a></span>
                            <span class="dim-text meta-line"><span class="handle-${ev.pubkey}">${escapeHtml(info.handle)}</span> · ${timeStr}</span>
                        </div>
                        <div class="pulse-badge">> 24H_PULSE / ${escapeHtml(expTimeStr)}</div>
                        <div class="post-content">${contentText}</div>
                        ${mediaHtml}
                        <div class="post-actions">
                            <button class="action-btn" title="Like" onclick="likeEvent('${ev.id}')">[+] <span id="metric-likes-${ev.id}">0</span></button>
                            <button class="action-btn" title="Quote" onclick="openQuoteModal('${ev.id}')">[q] quote</button>
                            <button class="action-btn" title="View Raw Data" onclick="openRawModal('${ev.id}')">[raw]</button>
                        </div>
                        <div class="client-tag">> pulse_event / via ${escapeHtml(clientName)}</div>
                    </div>
                `;
            }
            else {
                card.className = 'post-card';
                let contentHtml = ""; let mediaHtml = "";

                if (isJsonPayload) {
                    contentHtml = `<pre class="json-payload">${escapeHtml(parsedJsonContent)}</pre>`;
                } else {
                    let contentText = ev.content;
                    contentText = contentText.replace(/(https?:\/\/[^\s]+?\.(png|jpg|jpeg|gif|webp|mp4|webm|ogg)(\?[^\s]*)?)/gi, function(url, match1, ext) {
                        let lowerExt = ext.toLowerCase();
                        if (['mp4', 'webm', 'ogg'].includes(lowerExt)) mediaHtml += `<video controls class="post-video"><source src="${url}" type="video/${lowerExt}">Video format not supported.</video>`;
                        else mediaHtml += `<div class="post-media" onclick="openLightbox('${url}')"><img src="${url}" alt="Media"></div>`;
                        return "";
                    });
                    contentText = escapeHtml(contentText.trim()).replace(/(?:nostr:)?(n(?:pub|sec|ote|profile|event|addr|relay)1[a-z0-9]+)/gi, function(match, nip19Id) {
                        let shortId = nip19Id.substring(0, 10) + '...' + nip19Id.substring(nip19Id.length - 4);
                        return `<a href="nostr:${nip19Id}" class="nostr-embed-link" target="_blank" onclick="event.stopPropagation()">[NOSTR: ${shortId}]</a>`;
                    });
                    contentHtml = `<div class="post-content">${contentText}</div>`;
                }

                card.innerHTML = `
                    <a href="profile.html?pubkey=${ev.pubkey}" class="avatar-box avatar-${ev.pubkey}" style="text-decoration:none; color:inherit;">${avatarHtml}</a>
                    <div class="post-main">
                        <div class="post-header">
                            <span class="author-line"><a href="profile.html?pubkey=${ev.pubkey}"><strong class="author-${ev.pubkey}">${escapeHtml(info.name)}</strong></a></span>
                            <span class="dim-text meta-line"><span class="handle-${ev.pubkey}">${escapeHtml(info.handle)}</span> · ${timeStr}</span>
                        </div>
                        ${contentHtml}
                        ${mediaHtml}
                        <div class="post-actions">
                            <a href="thread.html?id=${ev.id}" class="action-btn" title="Reply" style="text-decoration:none;">[r] <span id="metric-replies-${ev.id}">0</span></a>
                            <button class="action-btn" title="Repost" onclick="repostEvent('${ev.id}')">[t] <span id="metric-reposts-${ev.id}">0</span></button>
                            <button class="action-btn" title="Like" onclick="likeEvent('${ev.id}')">[+] <span id="metric-likes-${ev.id}">0</span></button>
                            <button class="action-btn" title="Quote" onclick="openQuoteModal('${ev.id}')">[q]</button>
                            <button class="action-btn" title="View Raw Data" onclick="openRawModal('${ev.id}')">[raw]</button>
                            <button class="action-btn edit-btn edit-btn-${ev.pubkey} ${editBtnVisibility}" title="Edit Note" onclick="openEditModal('${ev.id}')">[edit]</button>
                        </div>
                        <div class="client-tag">> ${isJsonPayload ? 'telemetry_data' : 'text_note'} / via ${escapeHtml(clientName)}</div>
                    </div>
                `;
            }

            postsContainer.prepend(card);
            updateMetricsUI(ev.id);
        }

        function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

        broadcastBtn.addEventListener('click', async function() {
            let contentText = postContentInput.value.trim();
            if (!contentText) { alert('> ERROR: Message is empty!'); return; }
            if (!currentUserPubkey || !window.nostr) { alert('> ERROR: Not logged in!'); return; }

            let rawEvent = { kind: 1, created_at: Math.floor(Date.now() / 1000), tags: [["client", "Phosphor"]], content: contentText, pubkey: currentUserPubkey };
            try {
                broadcastBtn.textContent = '> SIGNING...';
                let signedEvent = await window.nostr.signEvent(rawEvent);
                let sentCount = 0;
                activeSockets.forEach(sock => { if (sock && sock.readyState === WebSocket.OPEN) { sock.send(JSON.stringify(["EVENT", signedEvent])); sentCount++; } });
                alert(`> SUCCESS: Broadcasted to ${sentCount} relays!`);
                postContentInput.value = ''; broadcastBtn.textContent = '> BROADCAST_EVENT';
                eventsCache[signedEvent.id] = signedEvent; renderPost(signedEvent);
            } catch (err) { alert('> ERROR: Failed to broadcast.'); broadcastBtn.textContent = '> BROADCAST_EVENT'; }
        });

        sendQuoteBtn.addEventListener('click', async function() {
            let quoteText = quoteContentInput.value.trim();
            if (!quoteTargetEvent) return;
            if (!currentUserPubkey || !window.nostr) { alert('> ERROR: Not logged in!'); return; }

            let rawEvent = { kind: 1, created_at: Math.floor(Date.now() / 1000), tags: [["e", quoteTargetEvent.id, "", "quote"], ["p", quoteTargetEvent.pubkey, ""], ["client", "Phosphor"]], content: `${quoteText}\n\nnostr:${quoteTargetEvent.id}`, pubkey: currentUserPubkey };
            try {
                sendQuoteBtn.textContent = '> SIGNING...';
                let signedEvent = await window.nostr.signEvent(rawEvent);
                let sentCount = 0;
                activeSockets.forEach(sock => { if (sock && sock.readyState === WebSocket.OPEN) { sock.send(JSON.stringify(["EVENT", signedEvent])); sentCount++; } });
                alert(`> QUOTE SUCCESS: Broadcasted to ${sentCount} relays!`);
                closeQuoteModal(); sendQuoteBtn.textContent = '> BROADCAST_QUOTE';
                eventsCache[signedEvent.id] = signedEvent; renderPost(signedEvent);
            } catch (err) { alert('> ERROR: Failed to send quote.'); sendQuoteBtn.textContent = '> BROADCAST_QUOTE'; }
        });

        sendEditBtn.addEventListener('click', async function() {
            let newText = editContentInput.value.trim();
            if (!newText) { alert('> ERROR: Message is empty!'); return; }
            if (!editTargetEvent || !currentUserPubkey || !window.nostr) return;

            try {
                sendEditBtn.textContent = '> SIGNING...';
                
                // NIP-09: Request deletion of the old event first
                let delEvent = { kind: 5, created_at: Math.floor(Date.now() / 1000), tags: [["e", editTargetEvent.id]], content: "Edited by user", pubkey: currentUserPubkey };
                let signedDelEvent = await window.nostr.signEvent(delEvent);
                
                // Create the new event holding the edited text
                let newEvent = { kind: editTargetEvent.kind, created_at: Math.floor(Date.now() / 1000), tags: editTargetEvent.tags, content: newText, pubkey: currentUserPubkey };
                let signedNewEvent = await window.nostr.signEvent(newEvent);
                
                let sentCount = 0;
                activeSockets.forEach(sock => { 
                    if (sock && sock.readyState === WebSocket.OPEN) { 
                        sock.send(JSON.stringify(["EVENT", signedDelEvent]));
                        sock.send(JSON.stringify(["EVENT", signedNewEvent]));
                        sentCount++; 
                    } 
                });
                
                alert(`> EDIT SUCCESS: Updated to ${sentCount} relays!`);
                
                // Immediately remove the old post DOM to prevent duplicates
                let oldCard = document.getElementById(`post-${editTargetEvent.id}`);
                if (oldCard) oldCard.remove();
                
                closeEditModal(); 
                sendEditBtn.textContent = '> UPDATE_EVENT';
                eventsCache[signedNewEvent.id] = signedNewEvent; 
                renderPost(signedNewEvent);
            } catch (err) { 
                alert('> ERROR: Failed to update event.'); 
                sendEditBtn.textContent = '> UPDATE_EVENT'; 
            }
        });

        window.addEventListener('DOMContentLoaded', loadConfig);
    </script>
</body>
</html>
